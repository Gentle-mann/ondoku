<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StylesGo Example Event Walkthrough</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f3f4;
        --ink: #111827;
        --muted: #4b5563;
        --green: #34a853;
        --line: #d9dee2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      }

      main {
        width: min(100%, 520px);
      }

      header {
        margin-bottom: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        font-size: 16px;
        font-weight: 850;
      }

      .mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: var(--green);
      }

      .mark::after {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 5px;
        background: white;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 8vw, 44px);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.4;
      }

      video {
        display: block;
        width: 100%;
        max-height: 78vh;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #000;
        box-shadow: 0 28px 70px rgba(17, 24, 39, 0.2);
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border-radius: 999px;
        background: var(--green);
        color: white;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><span class="mark" aria-hidden="true"></span> StylesGo Barber</div>
        <h1>Example Event Walkthrough</h1>
        <p>Lead barber event management walkthrough for sharing with the event team.</p>
      </header>
      <video controls playsinline preload="metadata" src="./stylesgo-example-event-lead-barber.mp4"></video>
      <div class="actions">
        <a href="./stylesgo-example-event-lead-barber.mp4" download>Download video</a>
      </div>
    </main>
  </body>
</html>
